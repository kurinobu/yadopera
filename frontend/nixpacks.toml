# Dokploy / Nixpacks: Vue Router (history) 用 SPA フォールバック
# start は `nginx -c /assets/nginx.conf`（Nixpacks publish directory ビルド）
[staticAssets]
"nginx.conf" = '''
worker_processes auto;
daemon off;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;
  server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
'''
